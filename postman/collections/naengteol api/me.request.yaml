$kind: http-request
method: GET
url: '{{base_url}}/auth/me'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('로그인 사용자를 반환한다', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().data.email).to.eql(pm.collectionVariables.get('email'));
      });
