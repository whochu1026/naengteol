$kind: http-request
name: signup duplicate
method: POST
url: '{{base_url}}/auth/signup'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('중복 이메일은 409이다', () => pm.response.to.have.status(409));
